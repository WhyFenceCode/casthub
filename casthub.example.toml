# Cast Hub example config. Placeholders only.
# Copy to /etc/casthub/casthub.toml (root:casthub, mode 0640) and fill in there.
# The real file is never committed.

[brand]
name_prefix = "Brand"            # receivers named Brand-1, Brand-2 …

[layout]
mode = "mirror_all"              # one receiver shown on every screen (the only mode; see SPEC)

[miracast]
base_port = 7250
wifi_direct = true
interface = "wlan0"
busy_policy = "reject"           # reject | replace
rtp_base_port = 1028             # the stream arrives here (UDP)
# Wi-Fi Direct casts: our address on the P2P link; Cast Hub hands out the rest by DHCP.
# Pick a private /24 that no network you join uses. Empty = Wi-Fi Direct casts are refused.
p2p_address = ""                 # unused (NetworkManager addresses Wi-Fi Direct groups)

[airplay]
enabled = true

[hotspot]
# The hub's own Wi-Fi network for phones when the network keeps devices apart (school Wi-Fi).
# It shares the radio with Wi-Fi: same channel as the network we're on (on a radar/DFS channel
# the hub leaves that network and runs the hotspot alone). A Wi-Fi Direct cast pauses it.
mode = "always"                  # auto (only when the network blocks casts) | always | off
share_internet = false           # true: hotspot devices get internet through our Wi-Fi
ssid = "<ssid>"                  # optional; default a fresh "Cast Hub XXXX" each start
# The password is new each time the hotspot starts; the QR code on screen carries it.

[switcher]
# Set with `casthub-pin` (writes pin_hash only; a plain `pin` here is refused).
pin_hash = ""

[display]
theme = "auto"                   # auto (light 07:00-19:00) | light | dark
location = "<city>, <region>"    # shown on the idle screen
latitude = 0.0                   # optional; shown under the status line
longitude = 0.0

[[screen]]                       # optional pinning; otherwise by plug order
output = "eDP-1"
name = "Brand-Main"
