# Cast Hub brand tokens: the ONLY place visual values are defined.
# Edit here, run `python3 brand/build.py`, then reinstall (tools/install-modes.sh).
#
# Source: design/ mockups (measured at 1:1 on the 1080×675 frame), cross-checked
# against the brand page on the Torsten Young website. Values marked GUESS are not
# shown in either and need the owner's confirmation.

[frame]
# Design frame of the mockups. Sizes below are in frame units; surfaces scale
# them by (screen height / height).
width = 1080
height = 675

[grid]
columns = 12
margin = 42
gutter = 21.6

[color]
accent = "#7E76D0"
# Status colours are pastel (owner decision). They are always used as chip/fill
# colours with on_status text: pastel text on paper is unreadable (≈1.4:1), while
# ink on these chips is 9.8–13:1. Pastel text is fine on dark surfaces (≥9:1).
success = "#9DD3B0"
warning = "#EDCF8E"
error = "#F2A29D"
on_status = "#0B0B0B"

[color.light]
bg = "#E6E6E6"        # paper (page background)
surface = "#EDEDED"   # windows, panels (design pages 8, 10)
fg = "#0B0B0B"        # ink; also window borders
muted = "#555555"
line = "#CBCBCB"      # hairlines, grid
well = "#D6D6D6"      # avatar / image wells, file tiles

# Boot splash (Plymouth): pure black, so the signature frames and the screen around them
# match exactly on any panel (owner request).
[boot]
bg = "#000000"

[color.dark]
bg = "#161616"        # night
surface = "#1C1C1C"   # windows, panels (design pages 6, 9, 11)
fg = "#FFFFFF"
muted = "#A0A0A0"
line = "#2E2E2E"
well = "#242424"      # file tiles (design page 11)

[color.terminal]
# The terminal is always dark, whatever the OS theme (design page 7). ANSI colours
# are not in the mockups: pastel, to match the status colours. A value without "#" names
# another token, so changing that token changes the terminal too.
bg = "dark.bg"
fg = "light.bg"
muted = "dark.muted"
black = "on_status"
red = "error"
green = "success"
yellow = "warning"
blue = "accent"
magenta = "#C2BBF0"
cyan = "#9CCFD8"
white = "light.bg"

[font]
display = "Bricolage Grotesque"   # wordmark, clock, headings
text = "Instrument Sans"          # body, titles
mono = "DM Mono"                  # labels, buttons, terminal
script = "Mrs Saint Delafield"    # signature only

# Type styles: size in frame units, weight, optional width axis (wdth %),
# letter spacing in em, uppercase.
[type.wordmark]
family = "display"
size = 14.6
weight = 800
width = 87.5
tracking = -0.01
upper = true

[type.clock]
family = "display"
size = 209
weight = 800
width = 75
tracking = -0.02

[type.date]
family = "display"
size = 31
weight = 500

[type.title]
family = "text"
size = 14.3
weight = 700

[type.body]
family = "text"
size = 12.5
weight = 400

[type.small]
family = "text"
size = 9.6
weight = 400

[type.name]
family = "text"
size = 12.4
weight = 600

[type.label]
family = "mono"
size = 9.2
weight = 400
tracking = 0.11
upper = true

# Display mode screens (design pages 12-13) are drawn on their own frame: 1080 x 633,
# margin 30, the same 12 columns. Sizes below are in that frame's pixels (measured).
[display]
width = 1080
height = 633
margin = 30
gutter = 18

[type.dclock]
family = "display"
size = 262          # digits 178 px tall
weight = 800
width = 78
tracking = -0.03

[type.ddate]
family = "display"
size = 56           # caps 37 px tall
weight = 800
width = 84
tracking = -0.02
upper = true

[type.dname]            # the receiver name on that line: letters and digits (CAST-XXXXX) need room
family = "display"
size = 56
weight = 800
width = 90
tracking = 0.06
upper = true

[type.dplace]
family = "text"
size = 30
weight = 400

[type.dbody]
family = "text"
size = 14.5
weight = 400

[type.dlabel]
family = "mono"
size = 11.2
weight = 400
tracking = 0.15
upper = true

[type.dnum]
family = "mono"
size = 9.5
weight = 400
tracking = 0.06

# Workstation desktop (M9), in 1080 x 675 frame units (u = screen height / 675).
# One thin top bar everywhere (D20, design page 10); the Console/Files dashboard (page 7)
# moves up by the difference (47 - 27). The app panel fills grid columns 5-12.
[shell]
bar = 27              # top bar height (rule at the bottom)
bar_margin = 15
panel_top = 59        # 79 on page 7, minus 20
panel_header = 40     # header strip above the docked window ("CONSOLE · ZSH")
panel_bottom = 639
panel_first_col = 4   # 0-based grid column where the panel starts

[type.barmark]
family = "display"
size = 11.1
weight = 800
width = 87.5
tracking = -0.01
upper = true

[type.barlabel]
family = "mono"
size = 8.4
weight = 400
tracking = 0.12
upper = true

[type.today]
family = "display"
size = 125
weight = 800
width = 75
tracking = -0.02

[type.faint]
family = "display"
size = 255
weight = 800
width = 75
tracking = -0.02

[type.tile]
family = "mono"
size = 7
weight = 400
tracking = 0.08
upper = true

[radius]
pill = 999
panel = 6           # GUESS: window/panel corners on the desktop mockups
popup = 10          # px: Plasma pop-ups, notifications, volume/brightness, tooltips

[motion]
fast = 120          # ms
normal = 220
