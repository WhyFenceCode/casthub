# Cast Hub: Console mode. Installed to /usr/share/casthub/console/sway.conf
# One fullscreen, always-dark terminal. Closing it (exit / Ctrl+D) ends the
# session and returns to the login screen.

xwayland disable
default_border none
output * bg #161616 solid_color
seat * shortcuts_inhibitor disable

bindsym --inhibited --no-repeat Ctrl+Mod1+Escape exec /usr/libexec/casthub/casthub-console-escape
# The Display panel (casthub-display) is a nested Sway window: fullscreen like Konsole.
for_window [app_id="wlroots"] fullscreen enable
for_window [app_id="org.kde.konsole"] fullscreen enable

exec systemctl --user start casthub-console.target
exec sh -c 'konsole --nofork --hide-menubar --hide-tabbar --profile /usr/share/konsole/CastHubConsole.profile; swaymsg exit'
