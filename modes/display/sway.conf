# Cast Hub: Display mode (kiosk). Installed to /usr/share/casthub/display/sway.conf
# Deliberately no default keybindings: nothing here opens apps or a shell.

xwayland disable
default_border none
default_floating_border none
focus_follows_mouse no
seat * hide_cursor 2000

# Background until the idle screens arrive (M6/M8). Colour = tokens night.
output * bg #161616 solid_color

# Escape. --inhibited fires even when a fullscreen client holds a shortcut
# inhibitor, and inhibitors are disabled outright as well.
seat * shortcuts_inhibitor disable
bindsym --inhibited --no-repeat Ctrl+Mod1+Escape exec /usr/libexec/casthub/casthub-leave

# Every cast window is fullscreen on its output.
for_window [app_id=".*"] fullscreen enable

# Text-console fallback: Ctrl+Alt+F3 (VT switching is handled by wlroots/logind).

exec systemctl --user start casthub-display.target
