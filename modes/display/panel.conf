# Display mode as a panel (casthub-display): a nested Sway inside Workstation or Console.
# Same screens and receiver as Display mode; Ctrl+Alt+Esc closes the panel instead of
# opening the leave page.
xwayland disable
default_border none
default_floating_border none
focus_follows_mouse no
seat * hide_cursor 2000
output * bg #161616 solid_color
seat * shortcuts_inhibitor disable
bindsym --inhibited --no-repeat Ctrl+Mod1+Escape exec /usr/libexec/casthub/casthub-panel-close
for_window [app_id=".*"] fullscreen enable
exec sh -c 'printf %s "$SWAYSOCK" > "$XDG_RUNTIME_DIR/casthub-panel.swaysock"'
exec env CASTHUB_PANEL=1 /usr/libexec/casthub/casthub-display-ui
# Restart the hub if it dies (Display mode gets this from systemd); it exits once Sway is gone.
exec sh -c 'while [ -S "$SWAYSOCK" ]; do /usr/libexec/casthub/casthub-hub -v 2>&1 | systemd-cat -t casthub-hub; sleep 1; done'
