# Cast Hub: NetworkManager leaves Wi-Fi Direct group interfaces (p2p-*) and the hotspot
# (casthub-ap) to casthub-p2p.
# casthub-p2p owns each group (go_intent 15), gives it an address and serves DHCP to the PC.
# Normal Wi-Fi stays with NetworkManager. Installed by tools/install-receiver.sh;
# undo: docs/RECOVERY.md, "Receiver".
[device-casthub-p2p]
match-device=interface-name:p2p-*,interface-name:casthub-ap
managed=0
