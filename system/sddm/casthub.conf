# Cast Hub SDDM settings. Installed to /etc/sddm.conf.d/casthub.conf
[Theme]
Current=casthub
CursorTheme=breeze_cursors

[Users]
# The display account logs in only through the Display mode tile.
HideUsers=casthub
RememberLastUser=true
RememberLastSession=true

[Wayland]
# Only the three Cast Hub modes exist, even if the theme falls back.
SessionDir=/usr/share/casthub/wayland-sessions

[X11]
SessionDir=/usr/share/casthub/x11-sessions
