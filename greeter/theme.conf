# Cast Hub login theme settings. Machine-specific values (Location, AdminUsers)
# go in theme.conf.user, written by tools/install-modes.sh, never in the repo.
[General]
# user  = follow the selected user's Plasma light/dark setting (FallbackScheme if unknown)
# light | dark = always; auto = dark from DarkFrom:00 until DarkUntil:00
ColorScheme=user
FallbackScheme=light
AppearanceDir=/var/lib/casthub/appearance
DarkFrom=19
DarkUntil=7
Wordmark=Torsten Young
OsLabel=Fedora Linux
SessionLabel=Wayland
Location=
DisplayUser=casthub
AdminUsers=
